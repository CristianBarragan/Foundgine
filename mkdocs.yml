site_name: Foundgine
site_description: "Semantic execution layer for .NET and Java"
repo_url: https://github.com/CristianBarragan/Foundgine
repo_name: CristianBarragan/Foundgine

theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: README.md
  - Standard (SES): STANDARDS.md
  - Getting started: GETTING-STARTED.md
  - Why Foundgine: WHY-FOUNDGINE.md
  - What Foundgine is designed for: APPLICATION-CATEGORIES.md
  - Architecture: ARCHITECTURE.md
  - Metadata → Semantics (layer setup): METADATA-TO-SEMANTICS.md
  - Mapping and connections: MAPPING.md
  - Open Intent API: OPEN-INTENT-API.md
  - Lexical grounding: LEXICAL-GROUNDING.md
  - Grounding decisions: GROUNDING-DECISIONS.md
  - Public API and provider independence: PUBLIC-API.md
  - Security: SECURITY.md
  - Runtime: RUNTIME.md
  - AOT: AOT.md
  - AI agent integration: AI-AGENT.md
  - Authorization: AUTHORIZATION.md
  - PostgreSQL E2E: POSTGRES-E2E.md
  - Testing: TESTING.md
  - Current status: CURRENT-STATUS.md
  - Roadmap: ROADMAP.md
  - Feature and capability wiki:
      - Overview: wiki/index.md
      - Core concepts: wiki/core-concepts.md
      - Semantic model and metadata: wiki/semantic-model.md
      - Intent, grounding and retrieval: wiki/intent-grounding.md
      - Planning and execution: wiki/planning-execution.md
      - Authorization and security: wiki/authorization-security.md
      - Mutations: wiki/mutations.md
      - Gateway, events and live updates: wiki/gateway-events.md
      - Providers:
          - Provider catalogue: wiki/providers.md
          - ORM providers (EF Core and JPA): wiki/orm-providers.md
          - Providers and storage: wiki/providers-storage.md
      - Extensions (GraphQL, Keycloak, Temporal): wiki/extensions.md
      - AI agents and MCP: wiki/agents-mcp.md
      - AOT and generated metadata: wiki/aot.md
      - Trust and proof:
          - Insights, evidence and auditing: wiki/insights-evidence-auditing.md
          - Approvals, audit and governance: wiki/approvals-audit-governance.md
          - Conformance and hardening: wiki/conformance-hardening.md
      - Operations and testing: wiki/operations.md
      - Cross-language implementation map: wiki/implementation-map.md
      - Glossary (plain words): wiki/glossary.md
  - History: history/README.md
