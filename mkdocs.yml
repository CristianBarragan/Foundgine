site_name: Foundgine
site_description: "Semantic execution layer for .NET"
repo_url: https://github.com/CristianBarragan/Foundgine
repo_name: CristianBarragan/Foundgine

theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: README.md
  - Standard (SES): STANDARDS.md
  - Getting started: GETTING-STARTED.md
  - Why Foundgine: WHY-FOUNDGINE.md
  - What Foundgine is designed for: APPLICATION-CATEGORIES.md
  - Architecture: ARCHITECTURE.md
  - Metadata → Semantics (layer setup): METADATA-TO-SEMANTICS.md
  - Mapping and connections: MAPPING.md
  - Open Intent API: OPEN-INTENT-API.md
  - Lexical grounding: LEXICAL-GROUNDING.md
  - Grounding decisions: GROUNDING-DECISIONS.md
  - Public API and provider independence: PUBLIC-API.md
  - Security: SECURITY.md
  - Runtime: RUNTIME.md
  - AOT: AOT.md
  - AI agent integration: AI-AGENT.md
  - Authorization: AUTHORIZATION.md
  - PostgreSQL E2E: POSTGRES-E2E.md
  - Testing: TESTING.md
  - Current status: CURRENT-STATUS.md
  - Roadmap: ROADMAP.md
  - History: history/README.md
