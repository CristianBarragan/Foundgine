services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: foundgine_e2e
      POSTGRES_USER: foundgine
      POSTGRES_PASSWORD: foundgine
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundgine -d foundgine_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    volumes:
      - foundgine-postgres-data:/var/lib/postgresql/data
      - ./src/csharp/tests/Foundgine.E2E.Tests/postgres-init.sql:/docker-entrypoint-initdb.d/001-foundgine-e2e.sql:ro
    restart: "no"

volumes:
  foundgine-postgres-data:
