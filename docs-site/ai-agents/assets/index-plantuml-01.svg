  <title id="title">Foundgine — AI agent capability boundary</title>
  <desc id="desc">An AI agent supplies structured intent to one Foundgine semantic execution boundary. The boundary resolves, validates, authorizes, plans and executes through a provider. The host owns identity and authority.</desc>
