# Local Keycloak for the supply-chain benchmark (dev mode, HTTP). One realm, shared by every arm.
#   docker compose -f compose/keycloak.yml up -d
# KC_HOSTNAME pins the issuer: every token carries iss=http://keycloak:8080/realms/supplychain whether the harness fetched it via
# 127.0.0.1:8080 (host) or an arm fetched JWKS via keycloak:8080 (compose network). All four arms validate THIS issuer and the
# audience `supplychain-api`; the arms join this compose network (see compose/supplychain.yml).
# cpuset 6-7 shares the loader's cores on purpose: Keycloak is idle in measured windows (tokens are cached client-side and
# refreshed ~once per 5 min per identity). Move it if you have spare cores and record the choice in environment.json.
name: supplychain
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    cpuset: "6-7"
    mem_limit: 1g
    volumes:
      - ../keycloak/supplychain-realm.json:/opt/keycloak/data/import/supplychain-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s
