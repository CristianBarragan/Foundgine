server:
  port: 4421
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sc_java_foundgine}
    username: ${SPRING_DATASOURCE_USERNAME:benchmark}
    password: ${SPRING_DATASOURCE_PASSWORD:benchmark}
  graphql:
    schema:
      locations: classpath:graphql/
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/supplychain}
          audiences: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES:supplychain-api}

foundgine:
  benchmark:
    redis-uri: ${FOUNGDINE_BENCHMARK_REDIS_URI:redis://localhost:6379}
