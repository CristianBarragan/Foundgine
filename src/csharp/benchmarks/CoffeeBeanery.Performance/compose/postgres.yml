name: coffeebeanery-query

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foundgine_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - benchmark-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d foundgine_benchmark"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  benchmark-postgres-data:
