services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foundgine_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - benchmark-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d foundgine_benchmark"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  database:
      build:
        context: ../..
        dockerfile: src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.Database/Dockerfile

      depends_on:
        postgres:
          condition: service_healthy

      environment:
        BankingConnectionString: "Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark"
        COFFEEBEANERY_CONNECTION: "Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark"

        COFFEEBEANERY_CUSTOMERS: "${COFFEEBEANERY_CUSTOMERS:-1000}"
        COFFEEBEANERY_RELATIONSHIPS_PER_CUSTOMER: "${COFFEEBEANERY_RELATIONSHIPS_PER_CUSTOMER:-4}"
        COFFEEBEANERY_CONTRACTS_PER_RELATIONSHIP: "${COFFEEBEANERY_CONTRACTS_PER_RELATIONSHIP:-3}"
        COFFEEBEANERY_TRANSACTIONS_PER_CONTRACT: "${COFFEEBEANERY_TRANSACTIONS_PER_CONTRACT:-4}"
      restart: "no"

  hotchocolate:
    build:
      context: ../..
      dockerfile: src/csharp/benchmarks/CoffeeBeanery.Performance/HotChocolate.CoffeeBeanery.BenchmarkApi/Dockerfile
    depends_on:
      database:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__BankingConnectionString: "Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark;ApplicationName=HotChocolate-Benchmark-API"
      ASPNETCORE_URLS: "http://+:4300"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "4300:4300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4300/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  foundgine-cold:
    build:
      context: ../..
      dockerfile: src/csharp/benchmarks/CoffeeBeanery.Performance/Foundgine.CoffeeBeanery.BenchmarkApi/Dockerfile
    depends_on:
      database:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__BankingConnectionString: "Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark;ApplicationName=Foundgine-Benchmark-API"
      ASPNETCORE_URLS: "http://+:4301"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "4301:4301"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4301/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  foundgine-warm:
    build:
      context: ../..
      dockerfile: src/csharp/benchmarks/CoffeeBeanery.Performance/Foundgine.CoffeeBeanery.BenchmarkApi/Dockerfile
    depends_on:
      database:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__BankingConnectionString: "Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark;ApplicationName=Foundgine-Benchmark-API"
      ASPNETCORE_URLS: "http://+:4302"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "4302:4302"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4302/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  loader:
    build:
      context: ../..
      dockerfile: src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.LoadTest/Dockerfile
    depends_on:
      hotchocolate:
        condition: service_healthy
      foundgine-cold:
        condition: service_healthy
      foundgine-warm:
        condition: service_healthy
    environment:
        BENCHMARK_HC_URL: "http://hotchocolate:4300/graphql"
        BENCHMARK_FOUNDGINE_COLD_URL: "http://foundgine-cold:4301/graphql/cold"
        BENCHMARK_FOUNDGINE_WARM_URL: "http://foundgine-warm:4302/graphql/warm"

        BENCHMARK_WARMUP_SECONDS: "${BENCHMARK_WARMUP_SECONDS:-3}"
        BENCHMARK_DURATION_SECONDS: "${BENCHMARK_DURATION_SECONDS:-10}"
        BENCHMARK_REQUEST_TIMEOUT_SECONDS: "${BENCHMARK_REQUEST_TIMEOUT_SECONDS:-5}"

        BENCHMARK_CONCURRENCY: "${BENCHMARK_CONCURRENCY:-1,8,16,32,64}"

        BENCHMARK_READINESS_TIMEOUT_SECONDS: "180"
        BENCHMARK_RESET_TIMEOUT_SECONDS: "180"

        BENCHMARK_REPORT_DIRECTORY: "${BENCHMARK_REPORT_DIRECTORY:-/reports}"

        BENCHMARK_DB_CONNECTION: "Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark"
    volumes:
      - ./reports:/reports
    restart: "no"

volumes:
  benchmark-postgres-data: