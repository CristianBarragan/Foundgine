services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: foundgine_supply_chain
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports: ["4429:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d foundgine_supply_chain"]
      interval: 2s
      timeout: 5s
      retries: 30
  supply-chain-mcp:
    build:
      context: ../../../
      dockerfile: src/csharp/benchmarks/AgentEndToEnd/Fixtures/SupplyChain.Layered/Api/Dockerfile
    environment:
      SupplyChainConnectionString: Host=postgres;Port=5432;Database=foundgine_supply_chain;Username=benchmark;Password=benchmark
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4422:8080"]
