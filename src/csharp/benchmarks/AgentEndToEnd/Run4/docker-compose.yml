services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foundgine_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark

    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB

    # Docker's default /dev/shm is 64MB. Postgres uses POSIX shared memory
    # (dsm_impl_posix) for parallel query workers and large sorts/hashes,
    # and 64MB is exhausted quickly once dozens of concurrent connections
    # (see max_connections above) are each doing work - it fails with
    # "could not resize shared memory segment ...: No space left on device"
    # (SQLSTATE 53100). This is unrelated to the data volume or its size;
    # raise the tmpfs-backed /dev/shm itself.
    shm_size: "1gb"

    ports:
      - "${POSTGRES_HOST_PORT:-0}:5432"

    volumes:
      - run4-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d foundgine_benchmark"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
      
    restart: "no"           
  graphql-ef:
    build:
      context: ../../..
      dockerfile: src/csharp/benchmarks/AgentEndToEnd/Run4/GraphQL.EF/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ConnectionStrings__BankingConnectionString: "Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark;ApplicationName=Foundgine-Run4-GraphQL-EF"
      ASPNETCORE_URLS: "http://+:4401"

    ports:
      - "4401:4401"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4401/health/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  mcp-foundgine:
    build:
      context: ../../..
      dockerfile: src/csharp/benchmarks/AgentEndToEnd/Run4/MCP.Foundgine/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ConnectionStrings__BankingConnectionString: "Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark;ApplicationName=Foundgine-Run4-MCP"
      ASPNETCORE_URLS: "http://+:4402"

    ports:
      - "4402:4402"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4402/health/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  run4-postgres-data: