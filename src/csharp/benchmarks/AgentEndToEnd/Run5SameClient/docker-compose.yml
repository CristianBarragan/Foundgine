services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: foundgine_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "${POSTGRES_HOST_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d foundgine_benchmark"]
      interval: 2s
      timeout: 5s
      retries: 30
  mcp-efcore:
    build:
      context: ../../../
      dockerfile: src/csharp/benchmarks/AgentEndToEnd/Run5SameClient/MCP.EfCore/Dockerfile
    environment:
      BankingConnectionString: Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4411:8080"]
  mcp-foundgine:
    build:
      context: ../../../
      dockerfile: src/csharp/benchmarks/AgentEndToEnd/Run5SameClient/MCP.Foundgine/Dockerfile
    environment:
      BankingConnectionString: Host=postgres;Port=5432;Database=foundgine_benchmark;Username=benchmark;Password=benchmark
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4412:8080"]
