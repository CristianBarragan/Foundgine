services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: foundgine_supply_chain
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports: ["4429:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d foundgine_supply_chain"]
      interval: 2s
      timeout: 5s
      retries: 30
  mcp-foundgine:
    build:
      context: ../../../../
      dockerfile: src/csharp/samples/Foundgine.SupplyChain.Advanced/MCP.Foundgine/Dockerfile
    environment:
      SupplyChainConnectionString: Host=postgres;Port=5432;Database=foundgine_supply_chain;Username=benchmark;Password=benchmark
      SupplyChainCustomers: ${SUPPLY_CHAIN_CUSTOMERS:-5}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4422:8080"]
