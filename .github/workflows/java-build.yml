
name: Java Build

on:
  push:
    branches:
      - main
      - java
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - java
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g -XX:+UseG1GC'

jobs:

  # ------------------------------------------------------------
  # 1. Build and run unit tests for the complete Java reactor
  # ------------------------------------------------------------
  java-build:
    name: Java Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Java Maven project
        id: maven-project
        shell: bash
        run: |
          set -euo pipefail

          POM_FILE="$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          candidates = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in {".git", "target", ".gradle", "node_modules"}
              ]

              if "pom.xml" not in files:
                  continue

              path = os.path.join(root, "pom.xml")

              try:
                  xml = ET.parse(path).getroot()
                  modules = xml.find("{*}modules")
                  artifact = xml.find("{*}artifactId")

                  module_names = []
                  if modules is not None:
                      module_names = [
                          (m.text or "").strip().replace("\\", "/")
                          for m in modules.findall("{*}module")
                      ]

                  artifact_id = (
                      artifact.text.strip()
                      if artifact is not None and artifact.text
                      else ""
                  )

                  has_core = any(
                      module.rstrip("/").split("/")[-1] == "foundgine-core"
                      for module in module_names
                  )

                  if has_core or artifact_id == "foundgine-parent":
                      candidates.append((path, has_core, artifact_id))

              except ET.ParseError:
                  continue

          if not candidates:
              raise SystemExit(
                  "Could not find the Foundgine Java parent POM."
              )

          candidates.sort(
              key=lambda item: (not item[1], item[0].count(os.sep), item[0])
          )

          print(os.path.abspath(candidates[0][0]))
          PY
          )"

          echo "pom=$POM_FILE" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM_FILE"

          test -f "$POM_FILE"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Verify Java and Maven
        run: |
          java --version
          mvn --version
          echo "Maven project: ${{ steps.maven-project.outputs.pom }}"

      - name: Build and run unit tests
        run: |
          mvn \
            -f "${{ steps.maven-project.outputs.pom }}" \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            clean package

      - name: Upload Maven build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-build-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 2. Security and penetration tests
  # ------------------------------------------------------------
  java-security-penetration:
    name: Java Security and Penetration Tests
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Java Maven project
        id: maven-project
        shell: bash
        run: |
          set -euo pipefail

          POM_FILE="$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          candidates = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in {".git", "target", ".gradle", "node_modules"}
              ]

              if "pom.xml" not in files:
                  continue

              path = os.path.join(root, "pom.xml")

              try:
                  xml = ET.parse(path).getroot()
                  modules = xml.find("{*}modules")
                  artifact = xml.find("{*}artifactId")

                  module_names = []
                  if modules is not None:
                      module_names = [
                          (m.text or "").strip().replace("\\", "/")
                          for m in modules.findall("{*}module")
                      ]

                  artifact_id = (
                      artifact.text.strip()
                      if artifact is not None and artifact.text
                      else ""
                  )

                  has_core = any(
                      module.rstrip("/").split("/")[-1] == "foundgine-core"
                      for module in module_names
                  )

                  if has_core or artifact_id == "foundgine-parent":
                      candidates.append((path, has_core, artifact_id))

              except ET.ParseError:
                  continue

          if not candidates:
              raise SystemExit("Foundgine Java parent pom.xml was not found.")

          candidates.sort(
              key=lambda item: (not item[1], item[0].count(os.sep), item[0])
          )

          print(os.path.abspath(candidates[0][0]))
          PY
          )"

          echo "pom=$POM_FILE" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM_FILE"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Run Foundgine Redteam tests
        run: |
          mvn \
            -f "${{ steps.maven-project.outputs.pom }}" \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -pl security/foundgine-redteam \
            -am \
            verify

      - name: Upload security test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-security-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 3. PostgreSQL / Docker integration and E2E tests
  # ------------------------------------------------------------
  java-postgres-e2e:
    name: Java PostgreSQL E2E Tests
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Java Maven project
        id: maven-project
        shell: bash
        run: |
          set -euo pipefail

          POM_FILE="$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          candidates = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in {".git", "target", ".gradle", "node_modules"}
              ]

              if "pom.xml" not in files:
                  continue

              path = os.path.join(root, "pom.xml")

              try:
                  xml = ET.parse(path).getroot()
                  modules = xml.find("{*}modules")
                  artifact = xml.find("{*}artifactId")

                  module_names = []
                  if modules is not None:
                      module_names = [
                          (m.text or "").strip().replace("\\", "/")
                          for m in modules.findall("{*}module")
                      ]

                  artifact_id = (
                      artifact.text.strip()
                      if artifact is not None and artifact.text
                      else ""
                  )

                  has_core = any(
                      module.rstrip("/").split("/")[-1] == "foundgine-core"
                      for module in module_names
                  )

                  if has_core or artifact_id == "foundgine-parent":
                      candidates.append((path, has_core, artifact_id))

              except ET.ParseError:
                  continue

          if not candidates:
              raise SystemExit("Foundgine Java parent pom.xml was not found.")

          candidates.sort(
              key=lambda item: (not item[1], item[0].count(os.sep), item[0])
          )

          print(os.path.abspath(candidates[0][0]))
          PY
          )"

          echo "pom=$POM_FILE" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM_FILE"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Verify Docker availability
        run: |
          docker version
          docker info

      - name: Verify PostgreSQL container image availability
        run: docker pull postgres:17

      - name: Run PostgreSQL integration and E2E tests
        run: |
          mvn \
            -f "${{ steps.maven-project.outputs.pom }}" \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            verify

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-postgres-e2e-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 4. Publish Java libraries to Maven Central
  # ------------------------------------------------------------
  publish-maven:
    name: Publish Java Packages to Maven Central
    runs-on: ubuntu-latest

    needs:
      - java-build
      - java-security-penetration
      - java-postgres-e2e

    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Java Maven project
        id: maven-project
        shell: bash
        run: |
          set -euo pipefail

          POM_FILE="$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          candidates = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in {".git", "target", ".gradle", "node_modules"}
              ]

              if "pom.xml" not in files:
                  continue

              path = os.path.join(root, "pom.xml")

              try:
                  xml = ET.parse(path).getroot()
                  modules = xml.find("{*}modules")
                  artifact = xml.find("{*}artifactId")

                  module_names = []
                  if modules is not None:
                      module_names = [
                          (m.text or "").strip().replace("\\", "/")
                          for m in modules.findall("{*}module")
                      ]

                  artifact_id = (
                      artifact.text.strip()
                      if artifact is not None and artifact.text
                      else ""
                  )

                  has_core = any(
                      module.rstrip("/").split("/")[-1] == "foundgine-core"
                      for module in module_names
                  )

                  if has_core or artifact_id == "foundgine-parent":
                      candidates.append((path, has_core, artifact_id))

              except ET.ParseError:
                  continue

          if not candidates:
              raise SystemExit("Foundgine Java parent pom.xml was not found.")

          candidates.sort(
              key=lambda item: (not item[1], item[0].count(os.sep), item[0])
          )

          print(os.path.abspath(candidates[0][0]))
          PY
          )"

          echo "pom=$POM_FILE" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM_FILE"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "Unable to determine release version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Foundgine Java version: $VERSION"

      # Validate secrets before importing the key.
      - name: Validate GPG secret configuration
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY is empty or unavailable."
            exit 1
          fi

          if [[ "$GPG_PRIVATE_KEY" != *"-----BEGIN PGP PRIVATE KEY BLOCK-----"* ]]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY is not an ASCII-armored private key."
            exit 1
          fi

          if [[ -z "$GPG_PASSPHRASE" ]]; then
            echo "::error::MAVEN_GPG_PASSPHRASE is empty or unavailable."
            exit 1
          fi

          echo "GPG secrets are present and the private key is armored."

      # setup-java imports the GPG private key into its GPG environment.
      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN

          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      # Verify the same GPG environment that Maven will use.
      - name: Verify imported GPG signing key
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking GPG environment..."

          if [[ -z "${GNUPGHOME:-}" ]]; then
            echo "::error::GNUPGHOME is not configured. GPG key import did not initialize."
            exit 1
          fi

          if [[ ! -d "$GNUPGHOME" ]]; then
            echo "::error::GPG home directory does not exist."
            exit 1
          fi

          echo "GPG home is configured."

          gpg --batch --list-secret-keys --keyid-format LONG

          if ! gpg --batch --list-secret-keys --with-colons | grep -q '^sec:'; then
            echo "::error::No GPG secret key was imported into the active keyring."
            exit 1
          fi

          echo "GPG signing key successfully imported."

      - name: Verify Maven Central credentials
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          test -n "$MAVEN_USERNAME"
          test -n "$MAVEN_CENTRAL_TOKEN"
          test -n "$MAVEN_GPG_PASSPHRASE"

          echo "Maven Central credentials are configured."
          echo "GPG passphrase is configured."

      # Publish only the four intended Java libraries.
      - name: Build and publish Foundgine Java libraries
        run: |
          mvn \
            -f "${{ steps.maven-project.outputs.pom }}" \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Drevision="${{ steps.version.outputs.version }}" \
            -pl foundgine-core,foundgine-runtime,foundgine-providers,foundgine-extensions \
            -am \
            -DskipTests \
            deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Report published version
        if: success()
        run: |
          echo "Successfully published Foundgine Java version ${{ steps.version.outputs.version }}"
