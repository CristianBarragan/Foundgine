name: Java Build

on:
  push:
    branches:
      - main
      - java
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - java
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g -XX:+UseG1GC'

jobs:

  # ------------------------------------------------------------
  # 1. Build and run unit tests
  # ------------------------------------------------------------
  java-build:
    name: Java Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Java Maven project
        id: maven-project
        shell: bash
        run: |
          set -euo pipefail

          POM_FILE="$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          candidates = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in {".git", "target", ".gradle", "node_modules"}
              ]

              if "pom.xml" not in files:
                  continue

              path = os.path.join(root, "pom.xml")

              try:
                  xml = ET.parse(path).getroot()
                  modules = xml.find("{*}modules")
                  artifact = xml.find("{*}artifactId")

                  module_names = []
                  if modules is not None:
                      module_names = [
                          (m.text or "").strip().replace("\\", "/")
                          for m in modules.findall("{*}module")
                      ]

                  artifact_id = (
                      artifact.text.strip()
                      if artifact is not None and artifact.text
                      else ""
                  )

                  has_core = any(
                      module.rstrip("/").split("/")[-1] == "foundgine-core"
                      for module in module_names
                  )

                  if has_core or artifact_id == "foundgine-parent":
                      candidates.append((path, has_core))

              except ET.ParseError:
                  continue

          if not candidates:
              raise SystemExit("Foundgine Java parent POM was not found.")

          candidates.sort(
              key=lambda item: (not item[1], item[0].count(os.sep), item[0])
          )

          print(os.path.abspath(candidates[0][0]))
          PY
          )"

          echo "pom=$POM_FILE" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM_FILE"
          test -f "$POM_FILE"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Verify Java and Maven
        run: |
          java --version
          mvn --version

      - name: Build and run unit tests
        run: |
          mvn \
            -f "${{ steps.maven-project.outputs.pom }}" \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Dgpg.skip=true \
            clean package

      - name: Upload Maven build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-build-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 2. Security and penetration tests
  # ------------------------------------------------------------
  java-security-penetration:
    name: Java Security and Penetration Tests
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Java Maven project
        id: maven-project
        shell: bash
        run: |
          set -euo pipefail

          POM_FILE="$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          candidates = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in {".git", "target", ".gradle", "node_modules"}
              ]

              if "pom.xml" not in files:
                  continue

              path = os.path.join(root, "pom.xml")

              try:
                  xml = ET.parse(path).getroot()
                  modules = xml.find("{*}modules")
                  artifact = xml.find("{*}artifactId")

                  module_names = []
                  if modules is not None:
                      module_names = [
                          (m.text or "").strip().replace("\\", "/")
                          for m in modules.findall("{*}module")
                      ]

                  artifact_id = (
                      artifact.text.strip()
                      if artifact is not None and artifact.text
                      else ""
                  )

                  has_core = any(
                      module.rstrip("/").split("/")[-1] == "foundgine-core"
                      for module in module_names
                  )

                  if has_core or artifact_id == "foundgine-parent":
                      candidates.append((path, has_core))

              except ET.ParseError:
                  continue

          if not candidates:
              raise SystemExit("Foundgine Java parent POM was not found.")

          candidates.sort(
              key=lambda item: (not item[1], item[0].count(os.sep), item[0])
          )

          print(os.path.abspath(candidates[0][0]))
          PY
          )"

          echo "pom=$POM_FILE" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM_FILE"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Run Foundgine Redteam tests
        run: |
          mvn \
            -f "${{ steps.maven-project.outputs.pom }}" \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Dgpg.skip=true \
            -pl security/foundgine-redteam \
            -am \
            verify

      - name: Upload security test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-security-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 3. PostgreSQL / Docker integration and E2E tests
  # ------------------------------------------------------------
  java-postgres-e2e:
    name: Java PostgreSQL E2E Tests
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Java Maven project
        id: maven-project
        shell: bash
        run: |
          set -euo pipefail

          POM_FILE="$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          candidates = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in {".git", "target", ".gradle", "node_modules"}
              ]

              if "pom.xml" not in files:
                  continue

              path = os.path.join(root, "pom.xml")

              try:
                  xml = ET.parse(path).getroot()
                  modules = xml.find("{*}modules")
                  artifact = xml.find("{*}artifactId")

                  module_names = []
                  if modules is not None:
                      module_names = [
                          (m.text or "").strip().replace("\\", "/")
                          for m in modules.findall("{*}module")
                      ]

                  artifact_id = (
                      artifact.text.strip()
                      if artifact is not None and artifact.text
                      else ""
                  )

                  has_core = any(
                      module.rstrip("/").split("/")[-1] == "foundgine-core"
                      for module in module_names
                  )

                  if has_core or artifact_id == "foundgine-parent":
                      candidates.append((path, has_core))

              except ET.ParseError:
                  continue

          if not candidates:
              raise SystemExit("Foundgine Java parent POM was not found.")

          candidates.sort(
              key=lambda item: (not item[1], item[0].count(os.sep), item[0])
          )

          print(os.path.abspath(candidates[0][0]))
          PY
          )"

          echo "pom=$POM_FILE" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM_FILE"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Verify Docker availability
        run: |
          docker version
          docker info

      - name: Verify PostgreSQL container image availability
        run: docker pull postgres:17

      - name: Run PostgreSQL integration and E2E tests
        run: |
          mvn \
            -f "${{ steps.maven-project.outputs.pom }}" \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Dgpg.skip=true \
            verify

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-postgres-e2e-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 4. Publish Java libraries to Maven Central
  # ------------------------------------------------------------
  publish-maven:
    name: Publish Java Packages to Maven Central
    runs-on: ubuntu-latest
    environment: production

    needs:
      - java-build
      - java-security-penetration
      - java-postgres-e2e

    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Java Maven project
        id: maven-project
        shell: bash
        run: |
          set -euo pipefail

          POM_FILE="$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          candidates = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in {".git", "target", ".gradle", "node_modules"}
              ]

              if "pom.xml" not in files:
                  continue

              path = os.path.join(root, "pom.xml")

              try:
                  xml = ET.parse(path).getroot()
                  modules = xml.find("{*}modules")
                  artifact = xml.find("{*}artifactId")

                  module_names = []
                  if modules is not None:
                      module_names = [
                          (m.text or "").strip().replace("\\", "/")
                          for m in modules.findall("{*}module")
                      ]

                  artifact_id = (
                      artifact.text.strip()
                      if artifact is not None and artifact.text
                      else ""
                  )

                  has_core = any(
                      module.rstrip("/").split("/")[-1] == "foundgine-core"
                      for module in module_names
                  )

                  if has_core or artifact_id == "foundgine-parent":
                      candidates.append((path, has_core))

              except ET.ParseError:
                  continue

          if not candidates:
              raise SystemExit("Foundgine Java parent POM was not found.")

          candidates.sort(
              key=lambda item: (not item[1], item[0].count(os.sep), item[0])
          )

          print(os.path.abspath(candidates[0][0]))
          PY
          )"

          echo "pom=$POM_FILE" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM_FILE"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "::error::Unable to determine release version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Foundgine Java version: $VERSION"

      # --------------------------------------------------------
      # Validate signing key without printing its contents
      # --------------------------------------------------------
      - name: Validate GPG signing secrets
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY is empty or unavailable."
            exit 1
          fi

          if [[ "$GPG_PRIVATE_KEY" != *"-----BEGIN PGP PRIVATE KEY BLOCK-----"* ]]; then
            echo "::error::The private key is not ASCII-armored."
            exit 1
          fi

          if [[ -z "$GPG_PASSPHRASE" ]]; then
            echo "::error::MAVEN_GPG_PASSPHRASE is empty or unavailable."
            exit 1
          fi

          echo "GPG signing secrets are configured."

      # --------------------------------------------------------
      # Validate Maven Central credentials
      # --------------------------------------------------------
      - name: Verify Maven Central credentials
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$MAVEN_USERNAME" ]]; then
            echo "::error::MAVEN_USERNAME is empty or unavailable."
            exit 1
          fi

          if [[ -z "$MAVEN_CENTRAL_TOKEN" ]]; then
            echo "::error::MAVEN_CENTRAL_TOKEN is empty or unavailable."
            exit 1
          fi

          echo "Maven Central credentials are configured."

      # --------------------------------------------------------
      # Configure Java and Maven Central
      # --------------------------------------------------------
      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN

      # --------------------------------------------------------
      # Diagnose Maven Central configuration without exposing
      # usernames, passwords, or tokens.
      # --------------------------------------------------------
      - name: Diagnose Maven Central publishing configuration
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -euo pipefail

          echo "Maven version:"
          mvn --version

          echo ""
          echo "Checking credential environment variables:"

          [[ -n "$MAVEN_USERNAME" ]] \
            && echo "MAVEN_USERNAME: present" \
            || { echo "::error::MAVEN_USERNAME is missing."; exit 1; }

          [[ -n "$MAVEN_CENTRAL_TOKEN" ]] \
            && echo "MAVEN_CENTRAL_TOKEN: present" \
            || { echo "::error::MAVEN_CENTRAL_TOKEN is missing."; exit 1; }

          echo ""
          echo "Checking Maven settings.xml:"

          SETTINGS_FILE="$HOME/.m2/settings.xml"

          if [[ ! -f "$SETTINGS_FILE" ]]; then
            echo "::error::Maven settings.xml was not generated."
            exit 1
          fi

          python3 - "$SETTINGS_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          root = ET.parse(path).getroot()

          servers = root.find("{*}servers")

          if servers is None:
              raise SystemExit("No Maven servers configuration found.")

          central = None

          for server in servers.findall("{*}server"):
              server_id = server.find("{*}id")

              if server_id is not None and server_id.text == "central":
                  central = server
                  break

          if central is None:
              raise SystemExit("Maven server ID 'central' was not found.")

          username = central.find("{*}username")
          password = central.find("{*}password")

          print("Maven server ID 'central': found")
          print("Username configuration:", "present" if username is not None and username.text else "missing")
          print("Password configuration:", "present" if password is not None and password.text else "missing")

          if username is None or not username.text:
              raise SystemExit("Central username configuration is missing.")

          if password is None or not password.text:
              raise SystemExit("Central password configuration is missing.")
          PY

          echo ""
          echo "Maven Central configuration checks passed."

      # --------------------------------------------------------
      # Publish only the four intended Java libraries.
      # Bouncy Castle reads the key from MAVEN_GPG_KEY.
      # --------------------------------------------------------
      - name: Build and publish Foundgine Java libraries
        run: |
          mvn \
            -f "${{ steps.maven-project.outputs.pom }}" \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Drevision="${{ steps.version.outputs.version }}" \
            -Dgpg.signer=bc \
            -Dgpg.keyEnvName=MAVEN_GPG_KEY \
            -pl foundgine-core,foundgine-runtime,foundgine-providers,foundgine-extensions \
            -am \
            -DskipTests \
            deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Report published version
        if: success()
        run: |
          echo "Successfully published Foundgine Java version ${{ steps.version.outputs.version }}"