name: Java — Build & Test

on:
  push:
    branches: [main, java]
    tags:
      - v*
  pull_request:
    branches: [main, java]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Java 21 build and tests
  # ============================================================
  java-build:
    name: Java 21 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test Java
        working-directory: src/java
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Building release version $VERSION"

            mvn -B -ntp \
              -Drevision="$VERSION" \
              verify
          else
            mvn -B -ntp verify
          fi

  # ============================================================
  # Java security penetration tests
  # ============================================================
  java-security-penetration:
    name: Java Security Penetration Gate
    needs:
      - java-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify penetration suite exists
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f src/java/security/pentest/run-all.sh ]]; then
            echo "ERROR: Java penetration suite not found."
            echo "Expected: src/java/security/pentest/run-all.sh"
            exit 1
          fi

      - name: Run standalone Java penetration suite
        working-directory: src/java/security/pentest
        env:
          SKIP_LIVE: "true"
        run: |
          set -euo pipefail
          chmod +x run-all.sh
          ./run-all.sh

  # ============================================================
  # Java PostgreSQL E2E tests
  # ============================================================
  java-postgres-e2e:
    name: Java PostgreSQL E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: foundgine
          POSTGRES_PASSWORD: foundgine
          POSTGRES_DB: foundgine_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundgine -d foundgine_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: foundgine
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if pg_isready \
              -h 127.0.0.1 \
              -p 5432 \
              -U foundgine \
              -d foundgine_e2e; then
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL did not become ready in time."
          exit 1

      - name: Run Java E2E tests
        working-directory: src/java
        env:
          FOUNDGINE_POSTGRES_CONNECTION_STRING: jdbc:postgresql://localhost:5432/foundgine_e2e?user=foundgine&password=foundgine
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REVISION=(-Drevision="$VERSION")
          else
            REVISION=()
          fi

          mvn -B -ntp \
            "${REVISION[@]}" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            "-Dtest=*E2ETest,*Postgres*E2ETest,*Postgres*ParityTest" \
            test

  # ============================================================
  # Publish Maven Central packages
  # ============================================================
  publish-maven:
    name: Publish Maven Central Packages

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - java-build
      - java-postgres-e2e
      - java-security-penetration

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "ERROR: Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "Publishing Foundgine Java version: $VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish four Foundgine Maven modules
        working-directory: src/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          mvn -B -ntp \
            -Drevision="$VERSION" \
            -Prelease \
            -pl foundgine-core,foundgine-runtime,foundgine-providers,foundgine-extensions \
            -am \
            -DskipTests \
            deploy