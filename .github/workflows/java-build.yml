name: Java — Build & Test

on:
  push:
    branches: [ main, java ]
    tags:
      - v*
  pull_request:
    branches: [ main, java ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-build:
    name: Java 21 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test Java
        working-directory: src/java
        run: mvn -B -ntp verify



  java-security-penetration:
    name: Java Security Penetration Gate
    runs-on: ubuntu-latest
    needs:
      - java-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run standalone Java penetration module
        working-directory: src/java
        run: >-
          mvn -B -ntp
          -pl security/pentest
          -am
          verify

  java-postgres-e2e:
    name: Java PostgreSQL E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: foundgine
          POSTGRES_PASSWORD: foundgine
          POSTGRES_DB: foundgine_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundgine -d foundgine_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: foundgine
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U foundgine -d foundgine_e2e; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time."
          exit 1

      - name: Run Java E2E tests
        working-directory: src/java
        env:
          FOUNDGINE_POSTGRES_CONNECTION_STRING: jdbc:postgresql://localhost:5432/foundgine_e2e?user=foundgine&password=foundgine
        run: >-
          mvn -B -ntp
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest='*E2ETest,*Postgres*E2ETest,*Postgres*ParityTest'
          test

  publish-maven:
    name: Publish Maven Central packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - java-build
      - java-postgres-e2e
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes ~/.m2/settings.xml with a <server id="central"> block whose
          # username/password are read from these env var names at deploy
          # time — the actual values never appear in this file or in git.
          # Add them under Settings → Secrets and variables → Actions,
          # scoped to the "production" environment above, using the
          # username/password pair (a Central Portal user token, generated
          # at https://central.sonatype.com/account) rather than a Sonatype
          # account password.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish Foundgine.Core / Foundgine.Runtime / Foundgine.Providers / Foundgine.Extensions
        working-directory: src/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mvn -B -ntp
          -Prelease
          -pl foundgine-core,foundgine-runtime,foundgine-providers,foundgine-extensions
          -am
          -DskipTests
          deploy
