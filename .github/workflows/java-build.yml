
name: Java Build

on:
  push:
    branches:
      - main
      - java
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - java
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g -XX:+UseG1GC'

jobs:

  # ------------------------------------------------------------
  # 1. Build and test the complete Java reactor
  # ------------------------------------------------------------
  java-build:
    name: Java Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Verify Java and Maven
        run: |
          java --version
          mvn --version

      - name: Build and test all Java modules
        run: |
          mvn --batch-mode \
              --no-transfer-progress \
              --errors \
              clean verify

      - name: Upload Maven build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-build-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 2. Security and penetration tests
  # ------------------------------------------------------------
  java-security-penetration:
    name: Java Security and Penetration Tests
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Run Foundgine Redteam tests
        run: |
          mvn --batch-mode \
              --no-transfer-progress \
              --errors \
              -pl security/foundgine-redteam \
              -am \
              verify

      - name: Upload security test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-security-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 3. PostgreSQL / Docker integration and E2E tests
  # ------------------------------------------------------------
  java-postgres-e2e:
    name: Java PostgreSQL E2E Tests
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Verify Docker availability
        run: |
          docker version
          docker info

      - name: Verify PostgreSQL container image availability
        run: docker pull postgres:17

      - name: Run PostgreSQL integration and E2E tests
        run: |
          mvn --batch-mode \
              --no-transfer-progress \
              --errors \
              verify

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-postgres-e2e-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 4. Publish Java libraries to Maven Central
  # ------------------------------------------------------------
  publish-maven:
    name: Publish Java Packages to Maven Central
    runs-on: ubuntu-latest
    needs:
      - java-build
      - java-security-penetration
      - java-postgres-e2e

    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "Unable to determine release version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Foundgine Java version: $VERSION"

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN

          # Import the signing key into an isolated GPG keyring.
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Verify GPG signing key
        shell: bash
        run: |
          set -euo pipefail

          gpg --list-secret-keys --keyid-format LONG

          gpg --list-secret-keys --with-colons \
            | grep -q '^sec:'

      - name: Verify Maven Central credentials
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          test -n "$MAVEN_USERNAME"
          test -n "$MAVEN_CENTRAL_TOKEN"
          test -n "$MAVEN_GPG_PASSPHRASE"

      - name: Build and publish Foundgine Java libraries
        run: |
          mvn --batch-mode \
              --no-transfer-progress \
              --errors \
              -Drevision="${{ steps.version.outputs.version }}" \
              -pl foundgine-core,foundgine-runtime,foundgine-providers,foundgine-extensions \
              -am \
              -DskipTests \
              deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Report published version
        if: success()
        run: |
          echo "Successfully published Foundgine Java version ${{ steps.version.outputs.version }}"
