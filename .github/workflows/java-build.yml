
name: Java Build

on:
  push:
    branches:
      - main
      - java
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - java
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g -XX:+UseG1GC'

jobs:

  # ------------------------------------------------------------
  # 1. Build and run unit tests
  # ------------------------------------------------------------
  java-build:
    name: Java Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: 'src/java/**/pom.xml'

      - name: Verify Java and Maven
        run: |
          java --version
          mvn --version

      - name: Build and run unit tests
        run: |
          mvn \
            -f src/java/pom.xml \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Dgpg.skip=true \
            clean package

      - name: Upload Maven build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-build-reports
          path: |
            src/java/**/target/surefire-reports/**
            src/java/**/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 2. Security and penetration tests
  # ------------------------------------------------------------
  java-security-penetration:
    name: Java Security and Penetration Tests
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: 'src/java/**/pom.xml'

      - name: Run Foundgine Redteam tests
        run: |
          mvn \
            -f src/java/pom.xml \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Dgpg.skip=true \
            -pl security/foundgine-redteam \
            -am \
            verify

      - name: Upload security test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-security-reports
          path: |
            src/java/**/target/surefire-reports/**
            src/java/**/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 3. PostgreSQL / Docker integration and E2E tests
  # ------------------------------------------------------------
  java-postgres-e2e:
    name: Java PostgreSQL E2E Tests
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: 'src/java/**/pom.xml'

      - name: Verify Docker availability
        run: |
          docker version
          docker info

      - name: Verify PostgreSQL container image availability
        run: docker pull postgres:17

      - name: Run PostgreSQL integration and E2E tests
        run: |
          mvn \
            -f src/java/pom.xml \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Dgpg.skip=true \
            verify

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-postgres-e2e-reports
          path: |
            src/java/**/target/surefire-reports/**
            src/java/**/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 4. Publish Java libraries to Maven Central
  # ------------------------------------------------------------
  publish-maven:
    name: Publish Java Packages to Maven Central
    runs-on: ubuntu-latest
    environment: production

    needs:
      - java-build
      - java-security-penetration
      - java-postgres-e2e

    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "::error::Unable to determine release version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Foundgine Java version: $VERSION"

      - name: Validate GPG signing secrets
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY is empty or unavailable."
            exit 1
          fi

          if [[ -z "$GPG_PASSPHRASE" ]]; then
            echo "::error::MAVEN_GPG_PASSPHRASE is empty or unavailable."
            exit 1
          fi

          echo "GPG signing secrets are configured."

      - name: Verify Maven Central credentials
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$MAVEN_USERNAME" ]]; then
            echo "::error::MAVEN_USERNAME is empty or unavailable."
            exit 1
          fi

          if [[ -z "$MAVEN_CENTRAL_TOKEN" ]]; then
            echo "::error::MAVEN_CENTRAL_TOKEN is empty or unavailable."
            exit 1
          fi

          echo "Maven Central credentials are configured."

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: 'src/java/**/pom.xml'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN

      - name: Diagnose Maven Central settings
        shell: bash
        run: |
          set -euo pipefail

          echo "Maven version:"
          mvn --version

          SETTINGS_FILE="$HOME/.m2/settings.xml"

          if [[ ! -f "$SETTINGS_FILE" ]]; then
            echo "::error::Maven settings.xml was not generated."
            exit 1
          fi

          python3 - "$SETTINGS_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          servers = root.find("{*}servers")

          if servers is None:
              raise SystemExit("No Maven servers configuration found.")

          central = None

          for server in servers.findall("{*}server"):
              server_id = server.find("{*}id")
              if server_id is not None and server_id.text == "central":
                  central = server
                  break

          if central is None:
              raise SystemExit("Maven server ID 'central' was not found.")

          username = central.find("{*}username")
          password = central.find("{*}password")

          if username is None or not username.text:
              raise SystemExit("Central username configuration is missing.")

          if password is None or not password.text:
              raise SystemExit("Central password configuration is missing.")

          print("Maven Central server configuration is present.")
          PY

      - name: Build and publish Foundgine Java libraries
        run: |
          mvn \
            -f src/java/pom.xml \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Drevision="${{ steps.version.outputs.version }}" \
            -Dgpg.signer=bc \
            -Dgpg.keyEnvName=MAVEN_GPG_KEY \
            -Dgpg.passphraseEnvName=MAVEN_GPG_PASSPHRASE \
            -pl foundgine-core,foundgine-runtime,foundgine-providers,foundgine-extensions \
            -am \
            -DskipTests \
            deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Report published version
        if: success()
        run: |
          echo "Successfully published Foundgine Java version ${{ steps.version.outputs.version }}"

  # ------------------------------------------------------------
  # 5. Publish GitHub Wiki
  # ------------------------------------------------------------
  publish-wiki:
    name: Publish GitHub Wiki
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Wiki source
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "docs/wiki" ]]; then
            echo "::error::docs/wiki directory does not exist."
            exit 1
          fi

          if [[ ! -f "docs/wiki/index.md" ]]; then
            echo "::error::docs/wiki/index.md does not exist."
            exit 1
          fi

      - name: Validate Wiki token
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$WIKI_TOKEN" ]]; then
            echo "::error::WIKI_TOKEN is empty or unavailable."
            exit 1
          fi

      - name: Clone GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            /tmp/foundgine-wiki

      - name: Synchronize Wiki documentation
        shell: bash
        run: |
          set -euo pipefail

          rsync -av --delete \
            --exclude='.git/' \
            --exclude='index.md' \
            docs/wiki/ /tmp/foundgine-wiki/

          # GitHub Wiki requires Home.md as its homepage.
          cp docs/wiki/index.md /tmp/foundgine-wiki/Home.md

      - name: Commit and publish Wiki
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/foundgine-wiki

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A
            git commit -m "Update Foundgine Wiki from docs/wiki"
            git push
          else
            echo "Wiki is already up to date."
          fi
