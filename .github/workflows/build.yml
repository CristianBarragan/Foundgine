  # ============================================================
  # Security gate
  # ============================================================
  security-gate:
    name: Security Gate
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # ============================================================
  # Publish NuGet packages
  # ============================================================
  publish-nuget:
    name: Publish NuGet packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-pack
      - unit-tests
      - supplychain-sample-tests
      - supplychain-semantic-sample-tests
      - integration-tests
      - benchmark-build-hotchocolate
      - benchmark-build-foundgine
      - agent-benchmark-smoke
      - security-gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Validate downloaded packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(artifacts/nuget/*.nupkg)

          expected_packages=(
            "Foundgine.Core"
            "Foundgine.Runtime"
            "Foundgine.Providers"
            "Foundgine.Extensions"
          )

          if [[ "${#packages[@]}" -ne "${#expected_packages[@]}" ]]; then
            echo "ERROR: Expected exactly four NuGet packages, found ${#packages[@]}."
            exit 1
          fi

          for package in "${packages[@]}"; do
            unzip -t "$package" >/dev/null
            echo "Validated: $package"
          done

          # Validate all four expected package IDs.
          for expected in "${expected_packages[@]}"; do
            matches=(artifacts/nuget/"${expected}".*.nupkg)

            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "ERROR: Expected exactly one ${expected} package."
              exit 1
            fi
          done

          # Correctly expand the Providers package glob.
          providers_packages=(artifacts/nuget/Foundgine.Providers.*.nupkg)

          if [[ "${#providers_packages[@]}" -ne 1 ]]; then
            echo "ERROR: Expected exactly one Foundgine.Providers package."
            exit 1
          fi

          providers_package="${providers_packages[0]}"

          required_analyzer="analyzers/dotnet/cs/Foundgine.Providers.Aot.Generator.dll"

          entries="$(unzip -Z1 "$providers_package")"

          if ! grep -Fxq "$required_analyzer" <<< "$entries"; then
            echo "ERROR: AOT generator is missing from the downloaded Providers package."
            exit 1
          fi

          echo "OK: all four expected packages validated"
          echo "OK: AOT analyzer present in Providers package"
          echo "Downloaded NuGet packages validated."

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Foundgine

      - name: Publish NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(artifacts/nuget/*.nupkg)

          if [[ "${#packages[@]}" -ne 4 ]]; then
            echo "ERROR: Expected exactly four packages to publish."
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Publishing $package"

            dotnet nuget push "$package" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done

          echo "NuGet publishing completed."