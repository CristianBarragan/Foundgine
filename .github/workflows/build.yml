  publish-nuget:
    name: Publish NuGet packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-pack
      - unit-tests
      - integration-tests
      - benchmark-build-hotchocolate
      - benchmark-build-foundgine
      - agent-benchmark-smoke
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Validate downloaded packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "ERROR: No NuGet packages downloaded."
            exit 1
          fi
          for package in "${packages[@]}"; do
            unzip -t "$package" >/dev/null
          done
          
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Foundgine

      - name: Publish NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done