name: Build, Test & Pack

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target"
        required: true
        default: dotnet
        type: choice
        options:
          - none
          - dotnet
          - java
          - both

permissions:
  contents: read

jobs:
  # ============================================================
  # Build and create NuGet packages
  # ============================================================
  build-pack:
    name: Build & Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Foundgine.sln

      - name: Build
        run: dotnet build Foundgine.sln --no-restore --configuration Release

      - name: Pack NuGet packages
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.4.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "Package version: $version"

          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget

          dotnet pack Foundgine.sln \
            --no-restore \
            --configuration Release \
            --output artifacts/nuget \
            -p:PackageVersion="$version"

      - name: Validate NuGet packages
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          echo "Available packages:"
          printf '  %s\n' artifacts/nuget/*.nupkg

          packages=(artifacts/nuget/*.nupkg)

          expected_packages=(
            "Foundgine.Core"
            "Foundgine.Runtime"
            "Foundgine.Providers"
            "Foundgine.Extensions"
          )

          if [[ "${#packages[@]}" -ne "${#expected_packages[@]}" ]]; then
            echo "ERROR: Expected exactly ${#expected_packages[@]} NuGet packages, produced ${#packages[@]}."
            exit 1
          fi

          for expected in "${expected_packages[@]}"; do
            if ! compgen -G "artifacts/nuget/${expected}.*.nupkg" > /dev/null; then
              echo "ERROR: Expected package was not produced: ${expected}"
              exit 1
            fi
          done

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "ERROR: No NuGet packages were produced."
            exit 1
          fi

          providers_packages=(artifacts/nuget/Foundgine.Providers.*.nupkg)

          if [[ "${#providers_packages[@]}" -ne 1 ]]; then
            echo "ERROR: Expected exactly one Foundgine.Providers package."
            exit 1
          fi

          package="${providers_packages[0]}"

          echo "Validating AOT assets in: $package"
          unzip -l "$package"

          required=(
            "lib/net9.0/Foundgine.Providers.dll"
            "README.md"
            "LICENSE"
          )

          for file in "${required[@]}"; do
            if ! unzip -l "$package" | grep -Fq "$file"; then
              echo "ERROR: Required package asset is missing: $file"
              exit 1
            fi
            echo "OK: $file"
          done

          if compgen -G "artifacts/nuget/Foundgine.Experimental.Aot.*.nupkg" > /dev/null; then
            echo "ERROR: Obsolete Foundgine.Experimental.Aot package was produced."
            exit 1
          fi
          echo "OK: no obsolete AOT package"

          unzip -t "$package" >/dev/null

          echo "NuGet package validation passed."

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error

  unit-tests:
    name: Unit Tests
    needs:
      - build-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Foundgine.sln

      - name: Build
        run: dotnet build Foundgine.sln --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test Foundgine.sln \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName!~Foundgine.E2E.Tests&FullyQualifiedName!~Foundgine.SupplyChain.PenTest.Tests" \
            --logger "console;verbosity=normal"

  supplychain-sample-tests:
    name: SupplyChain Sample Tests
    needs:
      - build-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore sample
        run: dotnet restore benchmarks/AgentEndToEnd/Fixtures/SupplyChain.Layered/Foundgine.SupplyChain.sln

      - name: Build sample
        run: dotnet build benchmarks/AgentEndToEnd/Fixtures/SupplyChain.Layered/Foundgine.SupplyChain.sln --no-restore --configuration Release

      - name: Run SupplyChain tests
        run: dotnet test benchmarks/AgentEndToEnd/Fixtures/SupplyChain.Layered/Tests/Foundgine.SupplyChain.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  supplychain-semantic-sample-tests:
    name: SupplyChain EndToEnd — Semantic Cases
    needs:
      - build-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore sample
        run: dotnet restore samples/Foundgine.SupplyChain.Advanced/Semantic/Foundgine.SupplyChain.Advanced.sln

      - name: Build sample
        run: dotnet build samples/Foundgine.SupplyChain.Advanced/Semantic/Foundgine.SupplyChain.Advanced.sln --no-restore --configuration Release

      - name: Run semantic SupplyChain tests
        run: dotnet test samples/Foundgine.SupplyChain.Advanced/Semantic/Tests/Foundgine.SupplyChain.Advanced.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  integration-tests:
    needs:
      - build-pack
    name: Integration Tests — PostgreSQL 17
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Foundgine.sln

      - name: Build
        run: dotnet build Foundgine.sln --no-restore --configuration Release

      - name: Start PostgreSQL 17
        env:
          POSTGRES_HOST_PORT: "55432"
        run: |
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml down -v --remove-orphans || true
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml \
            up -d --wait postgres

      - name: Verify PostgreSQL 17
        env:
          POSTGRES_HOST_PORT: "55432"
        run: |
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml \
            exec -T postgres \
            psql \
              -U foundgine \
              -d foundgine_e2e \
              -c 'select version();'

      - name: Run PostgreSQL E2E
        run: |
          dotnet test \
            tests/Foundgine.E2E.Tests/Foundgine.E2E.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName~Foundgine.E2E.Tests" \
            --logger "console;verbosity=normal"

      - name: PostgreSQL diagnostics on failure
        if: failure()
        env:
          POSTGRES_HOST_PORT: "55432"
        run: |
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml \
            logs --no-color postgres

      - name: Stop PostgreSQL
        if: always()
        env:
          POSTGRES_HOST_PORT: "55432"
        run: |
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml \
            down \
            --volumes \
            --remove-orphans

  agent-benchmark-smoke:
    name: Agent Benchmark Smoke — 1 Customer
    needs:
      - build-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Run agent benchmark smoke test
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $benchmarkScript = Join-Path "${{ github.workspace }}" 'benchmarks/AgentEndToEnd/run-all-agent-benchmarks.ps1'
          & $benchmarkScript -Smoke
          if ($LASTEXITCODE -ne 0) {
            throw "Agent benchmark smoke test failed with exit code $LASTEXITCODE."
          }

      - name: Run Supply Chain E2E benchmark
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $supplyChainScript = Join-Path "${{ github.workspace }}" 'samples/Foundgine.SupplyChain.Advanced/run-supply-chain.ps1'
          & $supplyChainScript
          if ($LASTEXITCODE -ne 0) {
            throw "Supply Chain E2E benchmark failed with exit code $LASTEXITCODE."
          }

      - name: Verify smoke test left no artifacts behind
        shell: pwsh
        run: |
          $benchmarkRoot = Join-Path "${{ github.workspace }}" 'benchmarks/AgentEndToEnd'
          $leftover = Get-ChildItem -Path $benchmarkRoot -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'artifacts') } |
            ForEach-Object { Join-Path $_.FullName 'artifacts' }
          if ($leftover) {
            Write-Warning "Smoke test left artifacts behind: $($leftover -join ', ')"
          }

  benchmark-build-hotchocolate:
    name: Performance Smoke — Hot Chocolate + EF Core
    needs:
      - build-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore benchmark projects
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            "benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.Database/CoffeeBeanery.Database.csproj"
            "benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.LoadTest/CoffeeBeanery.LoadTest.csproj"
            "benchmarks/CoffeeBeanery.Performance/HotChocolate.CoffeeBeanery.BenchmarkApi/HotChocolate.CoffeeBeanery.BenchmarkApi.csproj"
          )
          for project in "${projects[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project"
          done

      - name: Build benchmark projects
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            "benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.Database/CoffeeBeanery.Database.csproj"
            "benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.LoadTest/CoffeeBeanery.LoadTest.csproj"
            "benchmarks/CoffeeBeanery.Performance/HotChocolate.CoffeeBeanery.BenchmarkApi/HotChocolate.CoffeeBeanery.BenchmarkApi.csproj"
          )
          for project in "${projects[@]}"; do
            echo "Building $project"
            dotnet build "$project" --no-restore --configuration Release
          done

      - name: Pull PostgreSQL image with retry
        shell: bash
        run: |
          set -euo pipefail
          image="postgres:17-alpine"
          max_attempts=6
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Pulling $image (attempt $attempt/$max_attempts)..."
            if docker pull "$image"; then
              echo "Successfully pulled $image."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 10))
              echo "Docker registry pull failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "Unable to pull $image after $max_attempts attempts." >&2
          exit 1

      - name: Run performance smoke test
        shell: bash
        env:
          COFFEEBEANERY_CUSTOMERS: "1"
          COFFEEBEANERY_RELATIONSHIPS_PER_CUSTOMER: "4"
          COFFEEBEANERY_CONTRACTS_PER_RELATIONSHIP: "3"
          COFFEEBEANERY_TRANSACTIONS_PER_CONTRACT: "4"
          BENCHMARK_WARMUP_SECONDS: "1"
          BENCHMARK_DURATION_SECONDS: "1"
          BENCHMARK_REQUEST_TIMEOUT_SECONDS: "5"
          BENCHMARK_READINESS_TIMEOUT_SECONDS: "120"
          BENCHMARK_RESET_TIMEOUT_SECONDS: "30"
          BENCHMARK_CONCURRENCY: "1"
          BENCHMARK_BATCH_SIZES: "1"
          BENCHMARK_FAIL_ON_ERRORS: "true"
          POSTGRES_HOST_PORT: "55433"
        run: |
          set -euo pipefail
          COMPOSE=benchmarks/CoffeeBeanery.Performance/docker-compose.benchmark.yml
          PROJECT=foundgine-performance-smoke-hc
          cleanup() {
            docker compose -p "$PROJECT" -f "$COMPOSE" down -v --remove-orphans || true
          }
          trap cleanup EXIT
          cleanup
          docker compose -p "$PROJECT" -f "$COMPOSE" up -d --build postgres database hotchocolate
          docker compose -p "$PROJECT" -f "$COMPOSE" up --wait hotchocolate
          docker compose -p "$PROJECT" -f "$COMPOSE" run --rm --no-deps \
            -e BENCHMARK_TARGET_NAME="Hot Chocolate + EF Core" \
            -e BENCHMARK_TARGET_URL="http://hotchocolate:4300/graphql" \
            -e BENCHMARK_WARMUP_SECONDS="$BENCHMARK_WARMUP_SECONDS" \
            -e BENCHMARK_DURATION_SECONDS="$BENCHMARK_DURATION_SECONDS" \
            -e BENCHMARK_REQUEST_TIMEOUT_SECONDS="$BENCHMARK_REQUEST_TIMEOUT_SECONDS" \
            -e BENCHMARK_READINESS_TIMEOUT_SECONDS="$BENCHMARK_READINESS_TIMEOUT_SECONDS" \
            -e BENCHMARK_RESET_TIMEOUT_SECONDS="$BENCHMARK_RESET_TIMEOUT_SECONDS" \
            -e BENCHMARK_CONCURRENCY="$BENCHMARK_CONCURRENCY" \
            -e BENCHMARK_BATCH_SIZES="$BENCHMARK_BATCH_SIZES" \
            -e BENCHMARK_FAIL_ON_ERRORS="$BENCHMARK_FAIL_ON_ERRORS" \
            -e BENCHMARK_REPORT_DIRECTORY=/reports \
            loader

  benchmark-build-foundgine:
    name: Performance Smoke — Foundgine Warm Cache
    needs:
      - build-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore benchmark projects
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            "benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.Database/CoffeeBeanery.Database.csproj"
            "benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.LoadTest/CoffeeBeanery.LoadTest.csproj"
            "benchmarks/CoffeeBeanery.Performance/Foundgine.CoffeeBeanery.BenchmarkApi/Foundgine.CoffeeBeanery.BenchmarkApi.csproj"
          )
          for project in "${projects[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project"
          done

      - name: Build benchmark projects
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            "benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.Database/CoffeeBeanery.Database.csproj"
            "benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.LoadTest/CoffeeBeanery.LoadTest.csproj"
            "benchmarks/CoffeeBeanery.Performance/Foundgine.CoffeeBeanery.BenchmarkApi/Foundgine.CoffeeBeanery.BenchmarkApi.csproj"
          )
          for project in "${projects[@]}"; do
            echo "Building $project"
            dotnet build "$project" --no-restore --configuration Release
          done

      - name: Pull PostgreSQL image with retry
        shell: bash
        run: |
          set -euo pipefail
          image="postgres:17-alpine"
          max_attempts=6
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Pulling $image (attempt $attempt/$max_attempts)..."
            if docker pull "$image"; then
              echo "Successfully pulled $image."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 10))
              echo "Docker registry pull failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "Unable to pull $image after $max_attempts attempts." >&2
          exit 1

      - name: Run performance smoke test
        shell: bash
        env:
          COFFEEBEANERY_CUSTOMERS: "1"
          COFFEEBEANERY_RELATIONSHIPS_PER_CUSTOMER: "4"
          COFFEEBEANERY_CONTRACTS_PER_RELATIONSHIP: "3"
          COFFEEBEANERY_TRANSACTIONS_PER_CONTRACT: "4"
          BENCHMARK_WARMUP_SECONDS: "1"
          BENCHMARK_DURATION_SECONDS: "1"
          BENCHMARK_REQUEST_TIMEOUT_SECONDS: "5"
          BENCHMARK_READINESS_TIMEOUT_SECONDS: "120"
          BENCHMARK_RESET_TIMEOUT_SECONDS: "30"
          BENCHMARK_CONCURRENCY: "1"
          BENCHMARK_BATCH_SIZES: "1"
          BENCHMARK_FAIL_ON_ERRORS: "true"
          POSTGRES_HOST_PORT: "55434"
        run: |
          set -euo pipefail
          COMPOSE=benchmarks/CoffeeBeanery.Performance/docker-compose.benchmark.yml
          PROJECT=foundgine-performance-smoke-fg
          cleanup() {
            docker compose -p "$PROJECT" -f "$COMPOSE" down -v --remove-orphans || true
          }
          trap cleanup EXIT
          cleanup
          docker compose -p "$PROJECT" -f "$COMPOSE" up -d --build postgres database foundgine-warm
          docker compose -p "$PROJECT" -f "$COMPOSE" up --wait foundgine-warm
          docker compose -p "$PROJECT" -f "$COMPOSE" run --rm --no-deps \
            -e BENCHMARK_TARGET_NAME="Foundgine - provider-plan cache" \
            -e BENCHMARK_TARGET_URL="http://foundgine-warm:4302/graphql/warm" \
            -e BENCHMARK_WARMUP_SECONDS="$BENCHMARK_WARMUP_SECONDS" \
            -e BENCHMARK_DURATION_SECONDS="$BENCHMARK_DURATION_SECONDS" \
            -e BENCHMARK_REQUEST_TIMEOUT_SECONDS="$BENCHMARK_REQUEST_TIMEOUT_SECONDS" \
            -e BENCHMARK_READINESS_TIMEOUT_SECONDS="$BENCHMARK_READINESS_TIMEOUT_SECONDS" \
            -e BENCHMARK_RESET_TIMEOUT_SECONDS="$BENCHMARK_RESET_TIMEOUT_SECONDS" \
            -e BENCHMARK_CONCURRENCY="$BENCHMARK_CONCURRENCY" \
            -e BENCHMARK_BATCH_SIZES="$BENCHMARK_BATCH_SIZES" \
            -e BENCHMARK_FAIL_ON_ERRORS="$BENCHMARK_FAIL_ON_ERRORS" \
            -e BENCHMARK_REPORT_DIRECTORY=/reports \
            loader

  java-pipeline:
    name: Java Build & Test
    # Keep Java opt-in until the port reaches parity with Core/Runtime/Providers,
    # samples, benchmarks and security. Set repository variable
    # FOUNDGINE_JAVA_PIPELINE=true when the Java pipeline is ready.
    if: vars.FOUNDGINE_JAVA_PIPELINE == 'true' || github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'java' || inputs.deploy_target == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Java modules
        working-directory: src/java
        run: mvn -B -ntp verify

      - name: Upload Java artifacts
        uses: actions/upload-artifact@v7
        with:
          name: foundgine-java-artifacts
          path: |
            src/java/**/target/*.jar
            src/java/**/target/*.pom
          if-no-files-found: error

  publish-java:
    name: Publish Java artifacts
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (vars.FOUNDGINE_DEPLOY_TARGET == 'java' || vars.FOUNDGINE_DEPLOY_TARGET == 'both' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.deploy_target == 'java' || inputs.deploy_target == 'both')))
    needs:
      - java-pipeline
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Publish Java artifacts
        working-directory: src/java
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_REPOSITORY_URL: ${{ vars.MAVEN_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${MAVEN_USERNAME:-}" || -z "${MAVEN_PASSWORD:-}" ]]; then
            echo "Java deployment selected, but Maven repository credentials are not configured."
            exit 1
          fi
          repository_url="${MAVEN_REPOSITORY_URL:-https://maven.pkg.github.com/${GITHUB_REPOSITORY}}"
          cat > settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>foundgine</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B -ntp deploy \
            -s settings.xml \
            -Drevision="${GITHUB_REF_NAME#v}" \
            -DaltDeploymentRepository=foundgine::default::${repository_url}

  publish-nuget:
    name: Publish NuGet packages
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (vars.FOUNDGINE_DEPLOY_TARGET == 'dotnet' || vars.FOUNDGINE_DEPLOY_TARGET == 'both' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.deploy_target == 'dotnet' || inputs.deploy_target == 'both')))
    needs:
      - build-pack
      - unit-tests
      - integration-tests
      - benchmark-build-hotchocolate
      - benchmark-build-foundgine
      - agent-benchmark-smoke
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Validate downloaded packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "ERROR: No NuGet packages downloaded."
            exit 1
          fi
          for package in "${packages[@]}"; do
            unzip -t "$package" >/dev/null
          done
          
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Foundgine

      - name: Publish NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done