version: 2
updates:
  # .NET / NuGet dependencies across the whole solution
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Bundle routine minor/patch bumps into one PR instead of ten,
      # but keep security fixes ungrouped so they're never delayed
      # behind an unrelated version bump.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the GitHub Actions themselves patched too — action supply-chain
  # compromises (e.g. a tampered third-party action) are a real vector.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
