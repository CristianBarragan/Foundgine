1865,281,541.1865,277,545.1865" style="stroke: #55506A; stroke-width: 1.0;"/><line style="stroke: #55506A; stroke-width: 1.5;" x1="277" x2="277" y1="746.7144" y2="792.5264"/><polygon fill="#55506A" points="273,782.5264,277,792.5264,281,782.5264,277,786.5264" style="stroke: #55506A; stroke-width: 1.0;"/><line style="stroke: #55506A; stroke-width: 1.5;" x1="277" x2="277" y1="417.166" y2="476.2646"/><polygon fill="#55506A" points="273,466.2646,277,476.2646,281,466.2646,277,470.2646" style="stroke: #55506A; stroke-width: 1.0;"/><line style="stroke: #55506A; stroke-width: 1.5;" x1="277" x2="277" y1="950.6484" y2="970.6484"/><polygon fill="#55506A" points="273,960.6484,277,970.6484,281,960.6484,277,964.6484" style="stroke: #55506A; stroke-width: 1.0;"/><line style="stroke: #55506A; stroke-width: 1.5;" x1="277" x2="277" y1="829.9873" y2="913.1875"/><polygon fill="#55506A" points="273,903.1875,277,913.1875,281,903.1875,277,907.1875" style="stroke: #55506A; stroke-width: 1.0;"/><line style="stroke: #55506A; stroke-width: 1.5;" x1="277" x2="277" y1="1008.1094" y2="1040.1094"/><polygon fill="#55506A" points="273,1030.1094,277,1040.1094,281,1030.1094,277,1034.1094" style="stroke: #55506A; stroke-width: 1.0;"/><!--
@startuml lexical-grounding-flow
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Arial
skinparam shadowing false
skinparam ArrowColor #55506A
skinparam activity {
  FontSize 15
  FontColor #17132B
  BorderThickness 1.5
  BackgroundColor #FFFFFF
  BorderColor #55506A
}
skinparam titleFontSize 20
skinparam titleFontColor #17132B

title Foundgine — Lexical Grounding\nApproximate retrieval proposes candidates; the semantic contract stays authoritative

start
partition "Free-form language" #F3EFFF {
  :Natural language input;
  :Tokenization;
}
partition "Retrieval (advisory)" #FFF5E8 {
  :Candidate retrieval\n(every token x semantic kind\nvia ISemanticLexicalCandidateSource);
  note right
    Matched by alias:
    "purchase orders" / "buys" -> PurchaseOrder
    (declared [FoundgineAlias(["Buy","Buys"])])
    "supplier" / "seller" -> Supplier
    (declared [FoundgineAlias("Seller")])
  end note
  :Ranked lexical candidates;
}
partition "Graph-constrained resolution" #EEF9EF {
  :Start from the highest-scoring\nremaining candidate;
  repeat
    :Semantic-contract validation;
    :Neighbour-constrained graph walk;
  repeat while (Candidate cannot form\na valid path?) is (yes: backtrack to\nnext candidate) not (no)
  :Canonical semantic interpretation;
  note right
    "show me overdue purchase orders
    from our top supplier in Texas" and
    "show me overdue buys from our
    top seller in Texas" commit to the
    identical interpretation here.
  end note
}
partition "Same boundary as every other caller" #F0F5FF {
  :Authorization;
  :Planning / execution;
}
stop
@enduml

