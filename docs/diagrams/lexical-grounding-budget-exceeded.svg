skinparam backgroundColor #FFFFFF
skinparam defaultFontName Arial
skinparam shadowing false
skinparam ArrowColor #55506A
skinparam activity {
  FontSize 15
  FontColor #17132B
  BorderThickness 1.5
  BackgroundColor #FFEAEA
  BorderColor #55506A
}
skinparam titleFontSize 18
