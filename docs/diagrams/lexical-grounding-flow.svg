,768.7842,433.75,758.7842,429.75,762.7842" style="stroke: #55506A; stroke-width: 1.0;"/><line style="stroke: #55506A; stroke-width: 1.5;" x1="429.75" x2="429.75" y1="407.5254" y2="466.624"/><polygon fill="#55506A" points="425.75,456.624,429.75,466.624,433.75,456.624,429.75,460.624" style="stroke: #55506A; stroke-width: 1.0;"/><line style="stroke: #55506A; stroke-width: 1.5;" x1="429.75" x2="429.75" y1="902.8047" y2="922.8047"/><polygon fill="#55506A" points="425.75,912.8047,429.75,922.8047,433.75,912.8047,429.75,916.8047" style="stroke: #55506A; stroke-width: 1.0;"/><line style="stroke: #55506A; stroke-width: 1.5;" x1="429.75" x2="429.75" y1="806.2451" y2="865.3438"/><polygon fill="#55506A" points="425.75,855.3438,429.75,865.3438,433.75,855.3438,429.75,859.3438" style="stroke: #55506A; stroke-width: 1.0;"/><line style="stroke: #55506A; stroke-width: 1.5;" x1="429.75" x2="429.75" y1="960.2656" y2="992.2656"/><polygon fill="#55506A" points="425.75,982.2656,429.75,992.2656,433.75,982.2656,429.75,986.2656" style="stroke: #55506A; stroke-width: 1.0;"/><!--MD5=[f093c7edf07ff9c4d67102598140c76b]
@startuml lexical-grounding-flow
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Arial
skinparam shadowing false
skinparam ArrowColor #55506A
skinparam activity {
  FontSize 15
  FontColor #17132B
  BorderThickness 1.5
  BackgroundColor #FFFFFF
  BorderColor #55506A
}
skinparam titleFontSize 20
skinparam titleFontColor #17132B

title Foundgine — Lexical Grounding\nApproximate retrieval proposes candidates; the semantic contract stays authoritative

start
partition "Free-form language" #F3EFFF {
  :Natural language input;
  :Tokenization;
}
partition "Retrieval (advisory)" #FFF5E8 {
  :Candidate retrieval\n(every token x semantic kind\nvia ISemanticLexicalCandidateSource);
  :Ranked lexical candidates;
}
partition "Graph-constrained resolution" #EEF9EF {
  :Start from the highest-scoring\nremaining candidate;
  repeat
    :Semantic-contract validation;
    :Neighbour-constrained graph walk;
  repeat while (Candidate cannot form\na valid path?) is (yes: backtrack to\nnext candidate) not (no)
  :Canonical semantic interpretation;
}
partition "Same boundary as every other caller" #F0F5FF {
  :Authorization;
  :Planning / execution;
}
stop
@enduml

